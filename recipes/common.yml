---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: copy
    from: ironbar # rust
    src: /out/ironbar
    dest: /usr/bin/

  - type: copy
    from: matugen # rust
    src: /out/matugen
    dest: /usr/bin/

  - type: dnf
    repos:
      copr:
        - yalter/niri # packaged by the maintainer
        - atim/starship
        - lihaohong/yazi
        - varlad/zellij 
        - alebastr/sway-extras # swww seems up to date here
        - erikreider/SwayNotificationCenter
        - lukenukem/asus-linux # asusctl / asusd
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - charm.repo
      keys:
        - https://repo.charm.sh/yum/gpg.key
    install:
      packages:
        # DE
        - niri # rust
        - polkit
        - mate-polkit
        - rofi-wayland
        - xwayland-satellite
        - awww
        - SwayNotificationCenter
        - gtk-layer-shell # Required for ironbar
        - luajit # lua jit compiler for ironbar Can remove this by disabling the feature during the build

        # FS
        - nautilus
        # - samba
        - gvfs-fuse
        - gvfs-smb

        # Devices
        - light
        - pavucontrol
        - solaar
        - kde-connect
        - asusctl # ROG keyboard backlight (aura), replaces OpenRGB

        # Input method
        # - ibus # already provided by some package
        # - ibus-gtk3 # already provided by some package
        - ibus-mozc
        - ibus-panel

        # part of niri's weak dependencies
        # - xdg-desktop-portal-gtk
        # - xdg-desktop-portal-gnome
        # - gnome-keyring

        # Term and tools
        - kitty
        - helix # rust
        - btop 
        - starship # rust
        - fastfetch
        - lolcat
        - cava
        - cowsay
        - yazi # rust
        - zellij # rust
        - gum

        # Misc
        - tailscale
        - syncthing
        - rsync
        - davfs2 # to mount tailscale drive

        # dev
        - gcc
      exclude:
        - alacritty
        - waybar
        - waybar-git
        - fuzzel
        - mako
        - swaybg
    remove:
      packages:
        - htop
        - firefox

  - type: fonts
    fonts:
      nerd-fonts:
        - IBMPlexMono
        - FiraCode
      google-fonts:
        - Dancing Script
        - Pacifico
        - Lobster
        - Caveat
        - Twinkle Star
      url-fonts:
        - name: MapleMono-Variable
          # renovate: datasource: github-release depName: subframe7536/maple-font
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-Variable.zip
        - name: MapleMono-NF
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF.zip

  - type: chezmoi
    repository: "https://github.com/benoitlx/dotfiles"
    wait-after-boot: "1m"

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.discordapp.Discord
          - org.videolan.VLC
          - org.mozilla.Thunderbird
          - com.rtosta.zapzap
          - com.synology.SynologyDrive
          - md.obsidian.Obsidian        
          - com.usebottles.bottles
          - org.gnome.Snapshot
          - org.gnome.baobab
          - com.unicornsonlsd.finamp
          - com.github.iwalton3.jellyfin-media-player
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - org.gnome.World.PikaBackup
          - com.belmoussaoui.Authenticator
          - org.gnome.Calculator
          - org.gnome.Papers
          - org.gnome.Loupe
          - org.gnome.Boxes
          - me.iepure.devtoolbox
          - org.gnome.clocks
          - re.sonny.Eloquent
          - org.qbittorrent.qBittorrent
          - org.libreoffice.LibreOffice
          - org.kicad.KiCad
          - com.github.unrud.VideoDownloader
          - org.gnome.Connections
          - net.ankiweb.Anki
          - io.github.dvlv.boxbuddyrs
          - com.valvesoftware.Steam
          - com.bitwarden.desktop

  # - type: akmods
  #   install:
  #     - xone

  # Copy custom justfiles
  - type: files
    files:
      - source: justfiles
        destination: /usr/share/ublue-os/just

  - type: systemd
    user:
      enabled:
        - niri.service
        - ironbar.service
        - swaync.service
        - swww.service
        - xwayland-satellite.service
        - ibus.service
    system:
      enabled:
        - battery-charge-limit.service
        - polkit.service
      disabled:
        - NetworkManager-wait-online.service
        
  - type: signing
