---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/benoitlx/niri

name: niri-nvidia
description: personnal niri based image with nvidia support
base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia
image-version: latest

stages:
  - from-file: shared-stages.yml

modules:
  - from-file: common.yml

  # Boot speed: keep NVIDIA out of the initramfs (see the file for details)
  - type: files
    files:
      - source: dracut-nvidia
        destination: /usr/lib/dracut/dracut.conf.d

  # Must stay last: rebuilds the initramfs with every change above
  - type: initramfs
