# Boot speed: keep NVIDIA out of the initramfs.
#
# The base image's 99-nvidia.conf forces i915, amdgpu and the NVIDIA modules into
# the initramfs (force_drivers+=), and they load before udev looks for the disks:
# ~4.7 s of NVIDIA init before the LUKS prompt, and ~180 MB of the 389 MB image
# (GSP firmware + nvidia.ko) that GRUB must read on every boot.
#
# Nothing is forced either: forcing amdgpu cost ~3 s before the LUKS prompt.
# amdgpu stays in the initramfs (Plymouth pulls in the DRM drivers) and udev loads
# it in parallel with disk detection. NVIDIA is loaded later from the real root.
#
# This file sorts after 99-nvidia.conf, so the plain (empty) assignment below
# replaces its force_drivers list. Do not delete the line, or NVIDIA comes back.
# Needs the `initramfs` module to rebuild the image.
force_drivers=""
omit_drivers+=" i915 nvidia nvidia_drm nvidia_modeset nvidia_peermem nvidia_uvm "
